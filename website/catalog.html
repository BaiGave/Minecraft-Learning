        // ============================================
        // 渲染函数
        // ============================================

        function initCatalog() {
            renderNavigation();
            renderFooter();
            renderModulesCatalog();
            initSearch();
        }

        function renderNavigation() {
            const dropdown = document.getElementById('navDropdown');
            dropdown.innerHTML = Object.entries(moduleData).map(([key, mod]) => {
                const href = mod.versions
                    ? `${mod.docsDir}/${mod.defaultVersion || '1.21'}/index.html`
                    : `${mod.docsDir}/index.html`;
                return `<a href="${href}">${mod.name}</a>`;
            }).join('');
        }

        function renderFooter() {
            const footerLinks = document.getElementById('footerDocsLinks');
            footerLinks.innerHTML = Object.entries(moduleData).map(([key, mod]) => {
                const href = mod.versions
                    ? `${mod.docsDir}/index.html`
                    : `${mod.docsDir}/index.html`;
                return `<li><a href="${href}">${mod.name}</a></li>`;
            }).join('');
        }

        function renderModulesCatalog() {
            const container = document.getElementById('catalogContainer');
            let html = '';

            Object.entries(moduleData).forEach(([key, mod]) => {
                html += renderModuleSection(mod);
            });

            container.innerHTML = html;

            // 绑定版本切换事件
            document.querySelectorAll('.version-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const section = e.target.closest('.catalog-section');
                    const version = e.target.dataset.version;

                    section.querySelectorAll('.version-tab').forEach(t => t.classList.remove('active'));
                    section.querySelectorAll('.version-content').forEach(c => c.classList.remove('active'));

                    e.target.classList.add('active');
                    section.querySelector(`.version-content[data-version="${version}"]`).classList.add('active');
                });
            });
        }

        function renderModuleSection(mod) {
            const hasVersions = mod.versions && Object.keys(mod.versions).length > 0;

            let versionTabs = '';
            let versionContents = '';

            if (hasVersions) {
                versionTabs = `
                    <div class="version-tabs">
                        ${Object.keys(mod.versions).map((v, i) =>
                            `<button class="version-tab ${i === 0 ? 'active' : ''}" data-version="${v}">${mod.versions[v].name}</button>`
                        ).join('')}
                    </div>
                `;

                versionContents = Object.entries(mod.versions).map(([ver, data], i) => `
                    <div class="version-content ${i === 0 ? 'active' : ''}" data-version="${ver}">
                        ${renderDocCategory(data, mod, ver)}
                    </div>
                `).join('');
            } else {
                versionContents = `
                    <div class="version-content active" data-version="default">
                        ${renderDocCategory(mod, mod, null)}
                    </div>
                `;
            }

            return `
                <div class="catalog-section" id="${mod.slug}-section">
                    <div class="catalog-header" style="border-left-color: ${mod.color}">
                        <div class="catalog-icon" style="background: ${mod.colorGradient}">
                            <i class="fas fa-${mod.icon}"></i>
                        </div>
                        <div class="catalog-info">
                            <h2>${mod.name}</h2>
                            <p>${mod.description}</p>
                        </div>
                        <a href="${mod.docsDir}/index.html" class="catalog-link" style="background: ${mod.color}">
                            访问 <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                    ${versionTabs}
                    ${versionContents}
                </div>
            `;
        }

        function renderDocCategory(data, mod, version) {
            let html = '';
            const versionPath = version ? `${version}/` : '';

            // Analysis 文档
            if (data.analysis && data.analysis.length > 0) {
                html += `
                    <div class="doc-category">
                        <h3 class="category-title"><i class="fas fa-microscope"></i> 源码分析</h3>
                        <div class="doc-list">
                            ${data.analysis.map(doc => `
                                <div class="doc-item" onclick="navigateTo('${mod.docsDir}/${versionPath}analysis/${doc.id}.html')">
                                    <div class="doc-icon" style="background: ${mod.colorGradient}">
                                        <i class="fas fa-code"></i>
                                    </div>
                                    <div class="doc-info">
                                        <h3>${doc.title}</h3>
                                        <p>${doc.desc}</p>
                                    </div>
                                    <div class="doc-meta">
                                        <span><i class="fas fa-clock"></i> ${doc.time}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Tutorials 文档 (versioned modules like mc)
            if (data.tutorials && data.tutorials.length > 0) {
                html += `
                    <div class="doc-category">
                        <h3 class="category-title"><i class="fas fa-graduation-cap"></i> 教程指南</h3>
                        <div class="doc-list">
                            ${data.tutorials.map(doc => `
                                <div class="doc-item" onclick="navigateTo('${mod.docsDir}/${versionPath}tutorials/${doc.id}.html')">
                                    <div class="doc-icon" style="background: ${mod.colorGradient}">
                                        <i class="fas fa-book-open"></i>
                                    </div>
                                    <div class="doc-info">
                                        <h3>${doc.title}</h3>
                                        <p>${doc.desc}</p>
                                    </div>
                                    <div class="doc-meta">
                                        <span><i class="fas fa-clock"></i> ${doc.time}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // 普通 docs (用于没有 versions 的模块如 iris, sodium)
            if (data.docs && data.docs.length > 0 && !data.tutorials) {
                html += `
                    <div class="doc-category">
                        <h3 class="category-title"><i class="fas fa-book"></i> 教程</h3>
                        <div class="doc-list">
                            ${data.docs.map(doc => `
                                <div class="doc-item" onclick="navigateTo('${mod.docsDir}/tutorials/${doc.id}.html')">
                                    <div class="doc-icon" style="background: ${mod.colorGradient}">
                                        <i class="fas fa-book-open"></i>
                                    </div>
                                    <div class="doc-info">
                                        <h3>${doc.title}</h3>
                                        <p>${doc.desc}</p>
                                    </div>
                                    <div class="doc-meta">
                                        <span><i class="fas fa-clock"></i> ${doc.time}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function initSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.doc-item').forEach(item => {
                    const text = item.textContent.toLowerCase();
                    item.style.display = text.includes(query) ? 'flex' : 'none';
                });
            });
        }

        function navigateTo(url) {
            window.location.href = url;
        }

        function toggleMobileMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('mobile-open');
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', initCatalog);
    </script>
