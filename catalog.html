<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档目录 - Minecraft Learning</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-cube"></i>
                <span>Minecraft Learning</span>
            </a>
            <button class="mobile-menu-btn" onclick="Catalog.toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li class="dropdown">
                    <a href="#">文档中心 <i class="fas fa-chevron-down"></i></a>
                    <div class="dropdown-content" id="navDropdown"></div>
                </li>
                <li><a href="catalog.html" class="active">文档目录</a></li>
                <li><a href="roadmap.html">路线图</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-hero catalog-hero">
        <div class="hero-content">
            <div class="hero-badge">
                <i class="fas fa-list"></i>
                完整目录
            </div>
            <h1>文档目录</h1>
            <p class="hero-subtitle">探索所有可用文档，快速找到你需要的内容</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="catalogSearchInput" placeholder="搜索文档标题或内容...">
                </div>
            </div>

            <div id="catalogContainer">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>加载中...</span>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h3><i class="fas fa-cube"></i> Minecraft Learning</h3>
                    <p>探索 Minecraft 源码与模组开发的深度学习资源</p>
                </div>
                <div class="footer-links">
                    <h4>文档</h4>
                    <ul id="footerDocsLinks"></ul>
                </div>
                <div class="footer-links">
                    <h4>资源</h4>
                    <ul>
                        <li><a href="catalog.html">文档目录</a></li>
                        <li><a href="roadmap.html">学习路线</a></li>
                        <li><a href="about.html">关于</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Minecraft Learning | 基于开放源码研究</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
    // ============================================
    // Catalog Module - 完全隔离的目录页逻辑
    // ============================================
    const Catalog = (function() {
        let moduleData = {};

        async function loadModuleData() {
            try {
                const response = await fetch('docs-index.json');
                const data = await response.json();
                moduleData = data.modules || {};
                return moduleData;
            } catch (e) {
                console.error('加载模块数据失败:', e);
                return {};
            }
        }

        async function init() {
            const data = await loadModuleData();
            renderNavigation();
            renderFooter();
            renderModulesCatalog();
            initSearch();
        }

        function renderNavigation() {
            const dropdown = document.getElementById('navDropdown');
            if (!dropdown) return;

            const links = Object.entries(moduleData).map(([key, mod]) => {
                const href = mod.versions
                    ? `${mod.docsDir}/index.html`
                    : `${mod.docsDir}/index.html`;
                return `<a href="${href}">${mod.name}</a>`;
            }).join('');

            dropdown.innerHTML = links || '<a href="#">暂无文档</a>';
        }

        function renderFooter() {
            const footerLinks = document.getElementById('footerDocsLinks');
            if (!footerLinks) return;

            footerLinks.innerHTML = Object.entries(moduleData).map(([key, mod]) => {
                return `<li><a href="${mod.docsDir}/index.html">${mod.name}</a></li>`;
            }).join('');
        }

        function renderModulesCatalog() {
            const container = document.getElementById('catalogContainer');
            if (!container) return;

            let html = '';

            Object.entries(moduleData).forEach(([key, mod]) => {
                if (mod.versions) {
                    html += renderVersionedModule(mod);
                } else if (mod.docs && Object.keys(mod.docs).length > 0) {
                    html += renderSingleModule(mod);
                }
            });

            container.innerHTML = html || '<p style="text-align:center;padding:50px;color:#666;">暂无文档</p>';

            // 绑定版本切换事件
            document.querySelectorAll('.version-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const section = e.target.closest('.catalog-section');
                    const version = e.target.dataset.version;

                    section.querySelectorAll('.version-tab').forEach(t => t.classList.remove('active'));
                    section.querySelectorAll('.version-content').forEach(c => c.classList.remove('active'));

                    e.target.classList.add('active');
                    section.querySelector(`.version-content[data-version="${version}"]`).classList.add('active');
                });
            });
        }

        function renderVersionedModule(mod) {
            const versions = Object.keys(mod.versions);

            const versionTabs = `
                <div class="version-tabs">
                    ${versions.map((v, i) =>
                        `<button class="version-tab ${i === 0 ? 'active' : ''}" data-version="${v}">${mod.versions[v].name}</button>`
                    ).join('')}
                </div>
            `;

            const versionContents = versions.map((ver, i) => {
                const data = mod.versions[ver];
                return `
                    <div class="version-content ${i === 0 ? 'active' : ''}" data-version="${ver}">
                        ${renderDocCategories(data.docs, mod, ver)}
                    </div>
                `;
            }).join('');

            return `
                <div class="catalog-section" id="${mod.slug}-section">
                    <div class="catalog-header" style="border-left-color: ${mod.color}">
                        <div class="catalog-icon" style="background: ${mod.colorGradient}">
                            <i class="fas fa-${mod.icon}"></i>
                        </div>
                        <div class="catalog-info">
                            <h2>${mod.name}</h2>
                            <p>${mod.description}</p>
                        </div>
                        <a href="${mod.docsDir}/index.html" class="catalog-link" style="background: ${mod.color}">
                            访问 <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                    ${versionTabs}
                    ${versionContents}
                </div>
            `;
        }

        function renderSingleModule(mod) {
            return `
                <div class="catalog-section" id="${mod.slug}-section">
                    <div class="catalog-header" style="border-left-color: ${mod.color}">
                        <div class="catalog-icon" style="background: ${mod.colorGradient}">
                            <i class="fas fa-${mod.icon}"></i>
                        </div>
                        <div class="catalog-info">
                            <h2>${mod.name}</h2>
                            <p>${mod.description}</p>
                        </div>
                        <a href="${mod.docsDir}/index.html" class="catalog-link" style="background: ${mod.color}">
                            访问 <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                    <div class="version-content active" data-version="default">
                        ${renderDocCategories(mod.docs, mod, null)}
                    </div>
                </div>
            `;
        }

        function renderDocCategories(docs, mod, version) {
            let html = '';
            const versionPath = version ? `${version}/` : '';

            // Analysis 文档
            if (docs.analysis && docs.analysis.length > 0) {
                html += `
                    <div class="doc-category">
                        <h3 class="category-title"><i class="fas fa-microscope"></i> 源码分析</h3>
                        <div class="doc-list">
                            ${docs.analysis.map(doc => `
                                <a href="${mod.docsDir}/${versionPath}analysis/${doc.filename}" class="doc-item">
                                    <div class="doc-icon" style="background: ${mod.colorGradient}">
                                        <i class="fas fa-code"></i>
                                    </div>
                                    <div class="doc-info">
                                        <h3>${doc.title}</h3>
                                        <p>${doc.desc}</p>
                                    </div>
                                    <div class="doc-meta">
                                        <span><i class="fas fa-clock"></i> ${doc.time}</span>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Tutorials 文档
            if (docs.tutorials && docs.tutorials.length > 0) {
                html += `
                    <div class="doc-category">
                        <h3 class="category-title"><i class="fas fa-graduation-cap"></i> 教程指南</h3>
                        <div class="doc-list">
                            ${docs.tutorials.map(doc => `
                                <a href="${mod.docsDir}/${versionPath}tutorials/${doc.filename}" class="doc-item">
                                    <div class="doc-icon" style="background: ${mod.colorGradient}">
                                        <i class="fas fa-book-open"></i>
                                    </div>
                                    <div class="doc-info">
                                        <h3>${doc.title}</h3>
                                        <p>${doc.desc}</p>
                                    </div>
                                    <div class="doc-meta">
                                        <span><i class="fas fa-clock"></i> ${doc.time}</span>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function initSearch() {
            const searchInput = document.getElementById('catalogSearchInput');
            if (!searchInput) return;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.doc-item').forEach(item => {
                    const text = item.textContent.toLowerCase();
                    item.style.display = text.includes(query) ? 'flex' : 'none';
                });
            });
        }

        function toggleMobileMenu() {
            const navLinks = document.querySelector('.nav-links');
            if (navLinks) navLinks.classList.toggle('mobile-open');
        }

        return { init, toggleMobileMenu };
    })();

    document.addEventListener('DOMContentLoaded', () => {
        Catalog.init();
    });
    </script>

    <style>
        .catalog-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .catalog-hero .hero-badge {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
        }
        .search-section {
            max-width: 600px;
            margin: 0 auto 50px;
        }
        .catalog-section {
            margin-bottom: 60px;
        }
        .catalog-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px 30px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
            border-left: 5px solid;
        }
        .catalog-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            flex-shrink: 0;
        }
        .catalog-info {
            flex: 1;
        }
        .catalog-info h2 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        .catalog-info p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .catalog-link {
            padding: 10px 20px;
            color: white;
            border-radius: var(--radius-md);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .catalog-link:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
            color: white;
        }
        .version-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .version-tab {
            padding: 8px 20px;
            background: var(--gray-light);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .version-tab.active {
            background: var(--primary-color);
            color: white;
        }
        .version-tab:hover:not(.active) {
            background: var(--gray-dark);
            color: white;
        }
        .version-content {
            display: none;
        }
        .version-content.active {
            display: block;
        }
        .doc-category {
            margin-bottom: 30px;
        }
        .category-title {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-title i {
            color: var(--primary-color);
        }
        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .doc-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 25px;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }
        .doc-item:hover {
            transform: translateX(10px);
            box-shadow: var(--shadow-md);
        }
        .doc-item .doc-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .doc-item:hover .doc-icon {
            transform: rotate(5deg);
        }
        .doc-info {
            flex: 1;
        }
        .doc-info h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        .doc-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .doc-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .doc-meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .loading-state {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
        .loading-state i {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .catalog-header {
                flex-direction: column;
                text-align: center;
            }
            .doc-item {
                flex-direction: column;
                text-align: center;
            }
            .doc-meta {
                justify-content: center;
            }
        }
    </style>
</body>
</html>
