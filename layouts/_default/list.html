<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">
            <button class="menu-toggle" onclick="toggleMenu()">☰ 菜单</button>
            <ul class="nav-list" id="navList">
                {{ range .Site.Menus.main }}
                <li><a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a></li>
                {{ end }}
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h1>{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}</h1>
        {{ .Content }}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navList').classList.toggle('show');
        }
    </script>
</body>
</html>
